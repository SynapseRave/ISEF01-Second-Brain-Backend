services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: secondbrain
      POSTGRES_DB: secondbrain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondbrain"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@secondbrain.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpassfile:/pgpassfile:ro
    depends_on:
      postgres:
        condition: service_healthy

  mcp-notion:
    build: ./mcp_servers/notion
    restart: unless-stopped
    ports:
      - "3001:3001"

  mcp-todoist:
    build: ./mcp_servers/todoist
    restart: unless-stopped
    ports:
      - "3002:3002"

  mcp-google-calendar:
    build: ./mcp_servers/google_calendar
    restart: unless-stopped
    environment:
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
    ports:
      - "3003:3003"

  mcp-obsidian:
    build: ./mcp_servers/obsidian
    restart: unless-stopped
    ports:
      - "3004:3004"

  mcp-onenote:
    build: ./mcp_servers/onenote
    restart: unless-stopped
    ports:
      - "3005:3005"

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://secondbrain:secondbrain@postgres:5432/secondbrain
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_REALM: second-brain
      KEYCLOAK_CLIENT_ID: backend
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      CORS_ORIGINS: '["http://localhost:3000"]'
      MCP_NOTION_URL: http://mcp-notion:3001
      MCP_TODOIST_URL: http://mcp-todoist:3002
      MCP_GOOGLE_CALENDAR_URL: http://mcp-google-calendar:3003
      MCP_OBSIDIAN_URL: http://mcp-obsidian:3004
      MCP_ONENOTE_URL: http://mcp-onenote:3005
      MCP_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
