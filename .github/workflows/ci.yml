name: CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: secondbrain
          POSTGRES_PASSWORD: secondbrain
          POSTGRES_DB: secondbrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U secondbrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://secondbrain:secondbrain@localhost:5432/secondbrain
      TEST_DATABASE_URL: postgresql+asyncpg://secondbrain:secondbrain@localhost:5432/secondbrain_test
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: test-realm
      KEYCLOAK_CLIENT_ID: test-client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest tests/ -v
